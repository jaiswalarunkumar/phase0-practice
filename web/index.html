<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 0 - Fetch Practice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 16px; cursor: pointer; }
    ul { padding-left: 20px; }
    li { margin: 8px 0; }
    .error { color: #b00020; }
    .loading { color: #555; }
  </style>
</head>
<body>
  <h1>Posts</h1>
  <button id="loadBtn">Load posts</button>
  <p id="status"></p>
  <ul id="list"></ul>

  <script>
    const loadBtn = document.getElementById('loadBtn');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');

    async function loadPosts() {
      listEl.innerHTML = '';
      statusEl.textContent = 'Loading...';
      statusEl.className = 'loading';
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
        if (!response.ok) {
          throw new Error('Server error: ' + response.status);
        }
        const posts = await response.json();
        posts.forEach(post => {
          const li = document.createElement('li');
          li.textContent = post.id + '. ' + post.title;
          listEl.appendChild(li);
        });
        statusEl.textContent = posts.length + ' posts loaded';
        statusEl.className = '';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
        statusEl.className = 'error';
      }
    }

    loadBtn.addEventListener('click', loadPosts);
  </script>
</body>
</html>
